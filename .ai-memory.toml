# D-26 MCP-only service is installed locally; real client/cross-machine acceptance remains.
# MCP-only curated development notes first. Do not enable automatic hooks here.
workspace = "personal-development"
project = "fx-research-agent"

[profile]
contribute = false
consume = false

[capture]
# Defense in depth if hooks are enabled later; this is NOT prompt/output DLP.

[project]
name = "fxra"
version = "0.0.1"
description = "fx-research-agent: provenance-first forex research tooling around QuantConnect LEAN"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "jsonschema>=4.23",
    "tzdata",  # IANA timezones for zoneinfo/pyarrow on Windows
]

[project.scripts]
fxra = "fxra.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Template for one research run. Copy to experiments/<hypothesis-id>/research.toml.
# Placeholders in <...> must be replaced; nothing here picks a broker, pair or timeframe.
[run]
kind = "backtest"                     # backtest | walk_forward | stress | paper | demo
hypothesis_id = "<H-0001-short-name>" # must match experiments/<id>/hypothesis.md
strategy_path = "lean/<StrategyName>/main.py"
technical_only = false

[data]
source = "<source-id>"                # same id as in raw store manifests
symbols = ["<SYMBOL>"]
resolution = "<minute|hour|daily>"
start = 2000-01-01                    # <first day, inclusive>
end = 2000-12-31                      # <last day, inclusive>
timezone = "UTC"
# Every raw partition the run reads, as written by `fxra` (path + manifest sha256):
manifests = []

[assumptions]
# Say exactly what was modeled. "LEAN default" is an answer; leaving it blank is not.
spread = "<e.g. broker spread_points column from bars, p95 per hour>"
slippage = "<e.g. 0.5 pip per market order>"
swap = "<e.g. swaps dataset, observed_at nearest prior day>"
commission = "<e.g. 7 USD per lot round turn>"
fill_model = "<e.g. LEAN ImmediateFillModel>"

[split]
in_sample = { start = 2000-01-01, end = 2000-06-30 }
out_of_sample = { start = 2000-07-01, end = 2000-12-31 }   # untouched until the in-sample design is frozen
